name: Punchd
description: Punchd was a mobile customer-loyalty rewards application for small businesses, founded in
  2009 at Cal Poly San Luis Obispo by Reed Morse and Grantland Chew, that let merchants run digital
  punch-card loyalty programs. Google acquired the company in June 2011 and retired the product in June
  2013, folding features into other Google products. The getpunchd.com domain now serves only a static
  Google-hosted closure announcement. The company is defunct with no active product, developer program,
  or public API surface; this profile is retained for network completeness as a historical record.
